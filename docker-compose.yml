services:

  # ── 1. Ollama — LLM inference ──────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: manimax_ollama
    ports:
      - "11435:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # GPU variant — docker compose --profile nvidia up -d
  ollama-nvidia:
    image: ollama/ollama:latest
    container_name: manimax_ollama_nvidia
    profiles: ["nvidia"]
    ports:
      - "11435:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Intel Arc variant — docker compose --profile intel up -d
  ollama-intel:
    image: ollama/ollama:latest
    container_name: manimax_ollama_intel
    profiles: ["intel"]
    ports:
      - "11435:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - video
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── 2. Renderer — Python / Manim / ffmpeg video pipeline ──────────────────
  renderer:
    build:
      context: ./renderer
      dockerfile: Dockerfile
    image: manimax-renderer:latest
    container_name: manimax_renderer
    volumes:
      - manimax_media:/media
    env_file:
      - .env
    environment:
      - OLLAMA_URL=http://ollama:11434/api/generate
      - MEDIA_DIR=/media
      - IS_DOCKER=true
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5050/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ── 3. Web — Node.js + Socket.io frontend ─────────────────────────────────
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    image: manimax-web:latest
    container_name: manimax_web
    ports:
      - "3020:3020"
    volumes:
      - manimax_media:/media
    environment:
      - RENDERER_URL=http://renderer:5050
      - MEDIA_DIR=/media
      - PORT=3020
    depends_on:
      renderer:
        condition: service_healthy
    restart: unless-stopped

volumes:
  ollama_data:
  manimax_media:
