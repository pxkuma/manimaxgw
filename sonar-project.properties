# ── SonarQube Project Configuration ─────────────────────────────────────────
# This file is read automatically by sonar-scanner during the Jenkins pipeline.

sonar.projectKey=vrihi
sonar.projectName=Vrihi - Manimax
sonar.projectVersion=1.0

# ── Source directories ────────────────────────────────────────────────────────
sonar.sources=web,renderer

# ── Exclusions ────────────────────────────────────────────────────────────────
sonar.exclusions=\
  **/node_modules/**, \
  **/__pycache__/**, \
  **/*.pyc, \
  **/media/**, \
  **/.venv/**, \
  **/.cache/**, \
  **/Videos/**

# ── Language hints ────────────────────────────────────────────────────────────
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.python.version=3.11

# ── Encoding ──────────────────────────────────────────────────────────────────
sonar.sourceEncoding=UTF-8
